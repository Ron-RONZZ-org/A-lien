[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "A-lien"
version = "0.1.0"
description = "A — email and contacts plugin"
authors = [{name = "Ron"}]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "A-core>=0.1.0",
    "sievelib>=1.5.0",
    "managesieve>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[project.entry-points."A.commands"]
retposto = "A_lien.entry_points:retposto"
kontakto = "A_lien.entry_points:kontakto"

[project.entry-points."A.migrations"]
A-lien = "A_lien.data.migration_register:register"

[project.entry-points."A.backup"]
lien = "A_lien.data.storage:get_backup_targets"

[tool.hatch.build.targets.wheel]
packages = ["src/A_lien"]

[tool.uv.sources]
a-core = { path = "../A-core", editable = true }

[tool.poetry]
name = "A-lien"
version = "0.1.0"
description = "A — email and contacts plugin"
authors = ["Ron"]
license = "GPL-3.0-only"

[tool.poetry.dependencies]
python = "^3.11"
A-core = { path = "../A-core" }
typer = {version = ">=0.12.0", extras = ["rich"]}
rich = ">=13.0.0"
sievelib = ">=1.5.0"
managesieve = ">=0.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110", "S112"]